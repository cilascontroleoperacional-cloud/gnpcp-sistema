name: Atualizar dashboards GN (base -> Cloudflare)
on:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar no Cloudflare? (false = só gera e testa)"
        default: "true"
concurrency: atualizar-dashboards
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: dash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - run: pip install requests google-auth
      - name: Ler a base (Google Sheets)
        env: { GOOGLE_SA_JSON: "${{ secrets.GOOGLE_SA_JSON }}" }
        run: python fetch_base.py
      - name: Gerar os 4 HTMLs
        run: node run_base.js
      - name: Conferir (a seco)
        env: { CF_API_TOKEN: "${{ secrets.CF_API_TOKEN }}", CF_ACCOUNT_ID: "${{ secrets.CF_ACCOUNT_ID }}" }
        run: python deploy_cf.py --dry
      - name: Publicar no Cloudflare
        if: ${{ inputs.publicar != 'false' }}
        env: { CF_API_TOKEN: "${{ secrets.CF_API_TOKEN }}", CF_ACCOUNT_ID: "${{ secrets.CF_ACCOUNT_ID }}" }
        run: python deploy_cf.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: dashboards-html, path: dash/out_base/*.html, retention-days: 7 }
